name: Face2Face
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"
packages:
  Face2FaceCore:
    path: Face2FaceCore
targets:
  Face2Face:
    type: application
    platform: iOS
    sources:
      - path: Face2Face
        excludes: ["Info-*.plist", "*.entitlements"]
      - path: Face2FaceSurfaces
    dependencies:
      - package: Face2FaceCore
      - target: Face2FaceWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.rocky.face2face
        PRODUCT_NAME: Face2Face
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Face2Face/Face2Face.entitlements
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          INFOPLIST_FILE: Face2Face/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Face2Face/Info-Release.plist
  Face2FaceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Face2FaceWidgets
        excludes: ["Info.plist"]
      - path: Face2FaceSurfaces
    dependencies:
      - package: Face2FaceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.rocky.face2face.widgets
        PRODUCT_NAME: Face2FaceWidgets
        INFOPLIST_FILE: Face2FaceWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  Face2FaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Face2FaceTests
    dependencies:
      - target: Face2Face
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.rocky.face2face.tests
        PRODUCT_NAME: Face2FaceTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Face2Face.app/Face2Face"
        BUNDLE_LOADER: "$(TEST_HOST)"
  Face2FaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Face2FaceUITests
    dependencies:
      - target: Face2Face
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.rocky.face2face.uitests
        PRODUCT_NAME: Face2FaceUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  Face2Face:
    build:
      targets:
        Face2Face: all
        Face2FaceWidgets: all
    test:
      targets:
        - Face2FaceTests
        - Face2FaceUITests
